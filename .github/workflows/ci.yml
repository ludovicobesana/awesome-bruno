name: Markdown lint
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.md"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint README
        run: npx -y awesome-lint README.md
